{
	"arguments": [
		"--force-strict-mode",
		"--set-fps=60",
		"--vsync=1",
		"--auto-size-window",
		"--virtual-window-width=800",
		"--virtual-window-height=600",
		"--virtual-window-width-max=1066",
		"--play-sound-function=lib.sound.play_sound(me, sound)",
		"--play-music-function=lib.audio.play_music(obj, music)",
		"--ffl-allow-obj-api-from-class=true",
// saving these for the particle editor on kettering's machine
//       "--virtual-window-width=1600",
//        "--virtual-window-height=1000",
//      "--virtual-window-width-max=1600",
	],
	"custom_arguments": {
		"hax": false,
		"lucre": false,
		"supes": false
	},
	"dependencies": "gui",
	"font": "bitmap",
	"id": "frogtto4",
	"min_engine_version": 1.4,
	"name": "Frogatto & Friends",
	"player_type": "obj player_controlled",
	"validate_objects": "def(map definition, [string] protos) -> string|null
		if((definition.solid_area or definition.platform_area) and 'cosmetic_effects' not in protos,
			'objects with solid_area or platform_area must be derived from `cosmetic_effects`. Object is derived from: ' + protos + '.'
		)
	",
	"version": [
		4,
		29
	],
	"controls": {
		"names": {
			"jump": ~Jump~,
			"tongue": ~Tongue~,
			"item": ~Item~,
			"sprint": ~Sprint~,
			"inventory": ~Inventory~,
			"pane-left": ~Previous~,
			"pane-right": ~Next~,
			"item-left": "~Previous Item~",
			"item-right": "~Next item~"
		},
		"dialog_grid_size": [8, 6],
		"positions": {
			"pane-left": [0.5, 0],
			"pane-right": [1.5, 0],
			"item-left": [3.5,0],
			"item-right": [4.5,0.2],
			"inventory": [6,0],
			"sprint": [0,1.3],
			"jump": [1,1.3],
			"tongue": [2,1.3],
			"item": [3,1.3],
			"confirm": [1,2.5],
			"cancel": [2,2.5],
			"up": [5,1.5],
			"down": [5,2.5],
			"left": [4,2.5],
			"right": [6,2.5],
		},
		"positions_compact": {
			"pane-left": [0.5, -0.2],
			"pane-right": [1.5, 0],
			"item-left": [3,-0.2],
			"item-right": [4,0],
			"inventory": [6,-0.2],
			"sprint": [0,1],
			"jump": [1.5,1],
			"tongue": [2.5,1],
			"item": [3.5,1],
			"confirm": [1,2],
			"cancel": [2,2],
			"up": [5,1],
			"down": [5,2],
			"left": [4,2],
			"right": [6,2],
		},
		"key_bindings": {
			"jump": [
				[{"type": "keyboard", "code": 97, "strength": 1}] //A
			],
			"tongue": [
				[{"type": "keyboard", "code": 115, "strength": 1}] //S
			],
			"item": [
				[{"type": "keyboard", "code": 100, "strength": 1}] //D
			],
			"sprint": [
				[{"type": "keyboard", "code": 1073742049, "strength": 1}] //LShift
			],
			"inventory": [
				[{"type": "keyboard", "code": 105, "strength": 1}] //I
			],
			# Not sure how to structure this. The main point being that pane-left and item-left should both use Q,
			# and pane-right and item-right both use W.
			"pane-left": [
				[{"type": "keyboard", "code": 113, "strength": 1}] //Q
			],
			"pane-right": [
				[{"type": "keyboard", "code": 119, "strength": 1}] //W
			],
			"item-left": [
				[{"type": "keyboard", "code": 101, "strength": 1}] //E
			],
			"item-right": [
				[{"type": "keyboard", "code": 114, "strength": 1}] //R
			]
		},
		"button_bindings": {
			"jump": [
				[{"type": "joy_button", "code": 0, "strength": 1}] //Bottom of 4
			],
			"tongue": [
				[{"type": "joy_button", "code": 1, "strength": 1}] //Right of 4
			],
			"item": [
				[{"type": "joy_button", "code": 3, "strength": 1}] //Top of 4
			],
			"sprint": [
			],
			"inventory": [
				[{"type": "joy_button", "code": 6, "strength": 1}] // Right of the two center ones 'Select'
			],
			"pane-left": [
				[{"type": "joy_button", "code": 9, "strength": 1}] //L
			],
			"pane-right": [
				[{"type": "joy_button", "code": 10, "strength": 1}] //R
			],
		},
		# Currently unused
		"axes_bindings": {
			"SDL_CONTROLLER_AXIS_LEFTX": ["left", "right"],
			"SDL_CONTROLLER_AXIS_LEFTY": ["up", "down"],
			"SDL_CONTROLLER_AXIS_RIGHTX": ["look_left", "look_right"],
			"SDL_CONTROLLER_AXIS_RIGHTY": ["look_up", "look_down"],
		}
	}
}
